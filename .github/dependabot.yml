version: 2

updates:
  # Bun dependencies (root workspace)
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # Docker (addon/Dockerfile)
  - package-ecosystem: docker
    directory: /addon
    schedule:
      interval: weekly
