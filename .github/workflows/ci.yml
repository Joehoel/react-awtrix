name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run --filter react-awtrix typecheck

      - name: Lint
        run: bun run --filter react-awtrix lint

      - name: Format
        run: bun run --filter react-awtrix format:check

      - name: Unused code
        run: bun run --filter react-awtrix knip

      - name: Test
        run: bun run --filter react-awtrix test
