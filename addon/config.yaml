# Home Assistant local add-on manifest.
# Docs: https://developers.home-assistant.io/docs/add-ons/configuration/
name: React AWTRIX
slug: react_awtrix
description: Render React components to an AWTRIX 3 clock, driven by Home Assistant state.
# Unquoted on purpose: the builder's info helper passes these through verbatim,
# and quotes would end up inside the image tag (invalid reference).
version: 0.3.4
# Prebuilt multi-arch image published to GHCR by CI. Store installs pull this;
# local/SSH deploys strip it (see build.ts) and build from the Dockerfile.
image: ghcr.io/joehoel/react-awtrix/react_awtrix
arch:
  - aarch64
  - amd64
# We run the bundled app on the Bun base image (see Dockerfile/build.yaml), so
# no s6/bashio needed.
init: false
# Grants SUPERVISOR_TOKEN + the internal Core proxy (ws://supervisor/core/websocket).
# This is what lets the add-on talk to Home Assistant with zero configured tokens.
homeassistant_api: true
# Grants access to the Supervisor API (http://supervisor/services/mqtt, etc.)
# so the add-on can discover the MQTT broker configuration automatically.
hassio_api: true
hassio_role: admin
options:
  awtrix_host: ""
  awtrix_mqtt_prefix: ""
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
schema:
  awtrix_host: "str?"
  awtrix_mqtt_prefix: "str?"
  mqtt_host: "str?"
  mqtt_port: "int(1,65535)?"
  mqtt_username: "str?"
  mqtt_password: "str?"
